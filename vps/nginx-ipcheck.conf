# nginx перед ipcheck-echo: TLS здесь, echo слушает только 127.0.0.1:8887.
# Это шаблон: make -C vps nginx подставит хосты и зону из hosts.local.mk
# и соберёт bin/nginx-ipcheck.conf — его и копируй в /etc/nginx/sites-available/.
#
# Первая установка: HTTPS-блок ниже держи закомментированным, пока certbot
# не выпустит сертификат (иначе nginx -t упадёт) — см. README.

upstream ipcheck_echo {
    server 127.0.0.1:8887;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    # HTTP тоже отвечает echo: удобно для отладки, и certbot продлевает через этот блок
    location / {
        proxy_pass http://ipcheck_echo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SERVER_NAMES__;

    ssl_certificate /etc/letsencrypt/live/__ZONE__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__ZONE__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;

    location / {
        proxy_pass http://ipcheck_echo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-SNI $ssl_server_name;
    }
}
